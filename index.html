<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline MP3 Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <p class="eyebrow">Build-free / Offline / In-browser</p>
      <h1>MP4・WebMをMP3に変換</h1>
      <p class="lead">動画ファイルをこのページに入れるだけ。ファイルは端末内だけで処理され、サーバーへ送信されません。</p>
    </section>

    <section class="converter" aria-labelledby="converter-title">
      <h2 id="converter-title">変換するファイル</h2>
      <label id="drop-zone" class="drop-zone" for="file-input">
        <input id="file-input" type="file" accept="video/mp4,video/webm,.mp4,.webm" multiple>
        <span class="drop-icon">♪</span>
        <strong>クリックして選択、またはここにドロップ</strong>
        <small>対応入力: .mp4 / .webm（ブラウザが再生できる音声コーデック）</small>
      </label>

      <div class="settings" aria-label="MP3設定">
        <label>ビットレート
          <select id="bitrate-select">
            <option value="128">128 kbps</option>
            <option value="192" selected>192 kbps</option>
            <option value="256">256 kbps</option>
            <option value="320">320 kbps</option>
          </select>
        </label>
      </div>

      <button id="convert-button" type="button" disabled>MP3に変換</button>
      <div id="status" class="status" role="status" aria-live="polite">ファイルを選択してください。</div>
      <div class="progress-wrap" aria-label="変換進捗"><div id="progress-bar" class="progress-bar"></div></div>
      <ul id="file-list" class="file-list"></ul>
      <div id="results" class="results"></div>
    </section>

    <section class="notes">
      <h2>使い方と注意</h2>
      <ul>
        <li>このフォルダをそのまま保存し、<code>index.html</code> をブラウザで開くだけで使えます。</li>
        <li>変換はブラウザ標準のデコード・録音機能を使うため、完全にオフラインで動作します。</li>
        <li>お使いのブラウザが <code>audio/mpeg</code> の録音に対応していない場合は、対応ブラウザで開くよう案内します。</li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
